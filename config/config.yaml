# CS-30-1 baseline configuration

# Knowledge base build
knowledge_base:
  source: "openstax"  # or "pdf"
  openstax_api_url: "https://openstax.org/apps/cms/api/v2/pages"
  pdf_dir: "data/raw/openstax_pdfs"

  chunking:
    strategy: "structure_aware"  # structure_aware | fixed_size
    chunk_size: 512
    chunk_overlap: 64
    respect_headings: true

  embedding:
    model_name: "BAAI/bge-small-en-v1.5"  # or intfloat/e5-base-v2, thenlper/gte-small
    device: "auto"
    normalize_embeddings: true

  vector_store:
    backend: "faiss"  # faiss | pgvector
    faiss:
      index_path: "data/processed/knowledge_base.faiss"
      metric: "cosine"  # cosine | l2
    pgvector:
      dsn: "${PGVECTOR_DSN}"
      collection_name: "cs30_kb"
      dimension: 384

# Retrieval & generation
retrieval_generation:
  top_k: 5
  mode: "e1"  # e0 | e1

  prompt:
    template: |
      You are a helpful science tutor. Answer the multiple choice question below.
      Use only the retrieved context to support your answer. If the context is insufficient, say so.

      Context:
      {context}

      Question:
      {question}

      Choices:
      {choices}

      Provide your final answer as a single letter (A, B, C, or D) and a short explanation.
      Format: Answer: <letter>\nExplanation: <reasoning>

  llm:
    provider: "openai"  # openai | huggingface
    model: "gpt-3.5-turbo"
    temperature: 0.0
    max_tokens: 256
    api_key: "${OPENAI_API_KEY}"

# Evaluation
evaluation:
  dataset: "sciq"
  split: "test"
  max_samples: null
  output_path: "results/evaluation.json"
  baselines:
    - "e0"
    - "e1"
