[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs30-rag-baseline"
version = "0.1.0"
description = "Baseline RAG architecture for a personalised AI learning assistant using RAG and LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "5703-org" }
]
keywords = ["rag", "llm", "education", "openstax", "sciq"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
    "pymupdf>=1.23.0",
    "requests>=2.31.0",
    "sentence-transformers>=2.3.0",
    "faiss-cpu>=1.7.4",
    "openai>=1.12.0",
    "transformers>=4.37.0",
    "torch>=2.1.0",
    "datasets>=2.16.0",
    "scikit-learn>=1.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "black>=24.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310"]
